<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAG Concepts Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:90%;
max-width:900px;
background:#111827;
padding:30px;
border-radius:12px;
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

h1{
text-align:center;
color:#38bdf8;
margin-bottom:10px;
}

.progress{
height:8px;
background:#1f2937;
border-radius:10px;
overflow:hidden;
margin-bottom:25px;
}

.progress-bar{
height:8px;
background:#22c55e;
width:0%;
}

.question{
font-size:20px;
margin-bottom:15px;
}

.image{
text-align:center;
margin-bottom:15px;
}

.image img{
max-width:100%;
border-radius:8px;
}

.option{
background:#1f2937;
padding:12px;
margin:8px 0;
border-radius:6px;
cursor:pointer;
transition:0.2s;
}

.option:hover{
background:#334155;
}

.option.selected{
background:#2563eb;
}

.option.correct{
background:#16a34a;
}

.option.wrong{
background:#dc2626;
}

button{
margin-top:20px;
padding:12px 20px;
background:#22c55e;
border:none;
border-radius:6px;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

.result{
text-align:center;
font-size:22px;
}

</style>
</head>

<body>

<div class="container">

<h1>RAG Concepts Quiz</h1>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div id="quiz"></div>

<button id="nextBtn">Next</button>

</div>

<script>

const quizData=[

{
q:"What architecture combines document retrieval with LLM generation?",
img:"https://miro.medium.com/v2/resize:fit:1200/1*RAG_pipeline.png",
options:["RAG","CNN","GAN","Decision Tree"],
answer:0
},

{
q:"Which step converts text into vectors for semantic search?",
img:"https://miro.medium.com/v2/resize:fit:1200/1*embedding_vectors.png",
options:["Embedding","Tokenization","Compression","Scaling"],
answer:0
},

{
q:"Which database is designed to store embeddings for similarity search?",
img:"https://miro.medium.com/v2/resize:fit:1200/1*vector_database.png",
options:["Vector DB","Relational DB","Spreadsheet","File Storage"],
answer:0
},

{
q:"What process splits large documents into smaller pieces before embedding?",
img:"https://miro.medium.com/v2/resize:fit:1200/1*document_chunking.png",
options:["Chunking","Sharding","Sampling","Normalization"],
answer:0
},

{
q:"Which stage finds relevant documents using similarity search?",
img:"https://miro.medium.com/v2/resize:fit:1200/1*retriever_stage.png",
options:["Retriever","Tokenizer","Trainer","Optimizer"],
answer:0
},

{
q:"Which model generates the final answer in a RAG pipeline?",
img:"https://miro.medium.com/v2/resize:fit:1200/1*llm_generation.png",
options:["LLM","Database","Vector Store","Embedding Model"],
answer:0
},

{
q:"Which similarity metric is widely used in vector search?",
img:"https://miro.medium.com/v2/resize:fit:1200/1*cosine_similarity.png",
options:["Cosine similarity","Binary search","Sorting","Linear regression"],
answer:0
},

{
q:"What main problem does RAG reduce in LLM responses?",
img:"https://miro.medium.com/v2/resize:fit:1200/1*hallucination_ai.png",
options:["Hallucination","Overfitting","Gradient explosion","GPU crash"],
answer:0
},

{
q:"What step happens first when building a RAG knowledge base?",
img:"https://miro.medium.com/v2/resize:fit:1200/1*document_ingestion.png",
options:["Document ingestion","Generation","Prompt tuning","Training"],
answer:0
},

{
q:"RAG stands for:",
img:"https://miro.medium.com/v2/resize:fit:1200/1*rag_architecture.png",
options:["Retrieval Augmented Generation","Random AI Graph","Rapid Auto Generation","Recursive AI Generator"],
answer:0
}

];

let current=0;
let score=0;
let selected=null;

const quiz=document.getElementById("quiz");
const nextBtn=document.getElementById("nextBtn");
const progressBar=document.getElementById("progressBar");

function loadQuestion(){

selected=null;

let q=quizData[current];

let html=`<div class="question">${q.q}</div>`;

if(q.img){
html+=`<div class="image"><img src="${q.img}"></div>`;
}

q.options.forEach((opt,i)=>{
html+=`<div class="option" onclick="selectOption(this,${i})">${opt}</div>`;
});

quiz.innerHTML=html;

progressBar.style.width=((current)/quizData.length*100)+"%";
}

function selectOption(el,index){

document.querySelectorAll(".option").forEach(o=>o.classList.remove("selected"));

el.classList.add("selected");

selected=index;

}

nextBtn.onclick=function(){

if(selected===null){
alert("Select an option");
return;
}

const options=document.querySelectorAll(".option");

if(selected===quizData[current].answer){
score++;
options[selected].classList.add("correct");
}else{
options[selected].classList.add("wrong");
options[quizData[current].answer].classList.add("correct");
}

setTimeout(()=>{

current++;

if(current<quizData.length){
loadQuestion();
}else{
showResult();
}

},800);

}

function showResult(){

progressBar.style.width="100%";

quiz.innerHTML=`
<div class="result">
<h2>Your Score</h2>
<p>${score} / ${quizData.length}</p>
<button onclick="location.reload()">Restart Quiz</button>
</div>
`;

nextBtn.style.display="none";

}

loadQuestion();

</script>

</body>
</html>
