<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gen AI Concepts Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family: Arial, Helvetica, sans-serif;
background: linear-gradient(135deg,#0f172a,#020617);
color:white;
margin:0;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:90%;
max-width:800px;
background:#111827;
padding:30px;
border-radius:12px;
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

h1{
text-align:center;
margin-bottom:25px;
color:#38bdf8;
}

.question{
font-size:20px;
margin-bottom:20px;
}

.option{
background:#1f2937;
padding:12px;
margin:8px 0;
border-radius:6px;
cursor:pointer;
transition:0.2s;
}

.option:hover{
background:#334155;
}

.option.selected{
background:#2563eb;
}

button{
margin-top:20px;
padding:12px 20px;
background:#22c55e;
border:none;
border-radius:6px;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

.result{
text-align:center;
font-size:22px;
}

</style>
</head>

<body>

<div class="container">

<h1>Gen AI Concepts Quiz</h1>

<div id="quiz"></div>

<button id="nextBtn">Next</button>

</div>

<script>

const quizData = [

{
q:"1. A chatbot answers questions using company documents stored in a database. Which architecture is commonly used?",
options:["RAG","GAN","CNN","Decision Tree","Autoencoder"],
answer:0
},

{
q:"2. In a RAG system, what is the main purpose of retrieval?",
options:["Find relevant documents before generation","Train the LLM","Compress the model","Increase GPU speed","Create embeddings"],
answer:0
},

{
q:"3. When documents are converted into vectors for similarity search, what process is used?",
options:["Embedding","Tokenization","Compression","Normalization","Augmentation"],
answer:0
},

{
q:"4. Which type of database is typically used in RAG systems to store embeddings?",
options:["Vector database","Relational database","Graph database","Spreadsheet","File storage"],
answer:0
},

{
q:"5. Which tool is commonly used as a vector database?",
options:["Pinecone","MySQL","Oracle","PostgreSQL","Redis"],
answer:0
},

{
q:"6. In RAG, splitting large documents into smaller pieces before embedding is called:",
options:["Chunking","Sharding","Clustering","Scaling","Sampling"],
answer:0
},

{
q:"7. What problem does RAG mainly help reduce in LLMs?",
options:["Hallucinations","Overfitting","Gradient explosion","GPU overheating","Data imbalance"],
answer:0
},

{
q:"8. In the RAG pipeline, which step happens after retrieval?",
options:["Context is sent to LLM for generation","Model training","Database indexing","Embedding creation","Model compression"],
answer:0
},

{
q:"9. Which similarity method is commonly used to retrieve relevant vectors?",
options:["Cosine similarity","Binary search","Sorting","Graph traversal","Linear regression"],
answer:0
},

{
q:"10. If a user asks a question and the system retrieves the most relevant chunks before sending them to the LLM, this stage is called:",
options:["Context augmentation","Model fine-tuning","Token pruning","Hyperparameter tuning","Data labeling"],
answer:0
},

{
q:"11. Which framework is commonly used to build RAG pipelines?",
options:["LangChain","NumPy","Matplotlib","Scikit-learn","Pandas"],
answer:0
},

{
q:"12. In RAG, embeddings are used mainly to:",
options:["Measure semantic similarity","Train the neural network","Optimize GPU memory","Increase token length","Improve UI design"],
answer:0
},

{
q:"13. What happens if chunk size is too large in a RAG system?",
options:["Relevant info may be diluted","LLM becomes faster","Database shrinks","Embeddings disappear","Model retrains"],
answer:0
},

{
q:"14. What happens if chunk size is too small?",
options:["Loss of context","Model becomes inaccurate","GPU memory crashes","Database stops working","LLM retrains"],
answer:0
},

{
q:"15. Which stage converts text chunks into vector representations?",
options:["Embedding model","Retriever","Generator","Vector store","Prompt template"],
answer:0
},

{
q:"16. Which stage finds the most relevant documents?",
options:["Retriever","Generator","Tokenizer","Optimizer","Trainer"],
answer:0
},

{
q:"17. Which component generates the final answer in RAG?",
options:["LLM generator","Vector database","Embedding model","Retriever","Chunker"],
answer:0
},

{
q:"18. A system that answers questions over PDFs using embeddings and vector search is an example of:",
options:["RAG application","Image classification","Reinforcement learning","GAN training","Speech recognition"],
answer:0
},

{
q:"19. Which step happens first when building a RAG knowledge base?",
options:["Document ingestion","Answer generation","Query rewriting","Similarity search","Prompt execution"],
answer:0
},

{
q:"20. RAG stands for:",
options:["Retrieval Augmented Generation","Recursive AI Graph","Random Access Generation","Reinforced Agent Generation","Rapid AI Graph"],
answer:0
}

];

let current=0;
let score=0;
let selected=null;

const quiz=document.getElementById("quiz");
const nextBtn=document.getElementById("nextBtn");

function loadQuestion(){

selected=null;

let q=quizData[current];

let html=`<div class="question">${q.q}</div>`;

q.options.forEach((opt,i)=>{

html+=`<div class="option" onclick="selectOption(this,${i})">${opt}</div>`;

});

quiz.innerHTML=html;

}

function selectOption(el,index){

document.querySelectorAll(".option").forEach(o=>o.classList.remove("selected"));

el.classList.add("selected");

selected=index;

}

nextBtn.onclick=function(){

if(selected===null){
alert("Select an option");
return;
}

if(selected===quizData[current].answer){
score++;
}

current++;

if(current<quizData.length){
loadQuestion();
}
else{
showResult();
}

}

function showResult(){

quiz.innerHTML=`
<div class="result">
<h2>Your Score</h2>
<p>${score} / ${quizData.length}</p>
</div>
`;

nextBtn.style.display="none";

}

loadQuestion();

</script>

</body>
</html>
