<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAG Concepts Quiz</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020617,#0f172a,#020617);
color:white;
}

.container{
width:900px;
max-width:95%;
padding:40px;
border-radius:16px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
box-shadow:0 0 30px rgba(0,0,0,0.6);
}

h1{
text-align:center;
color:#38bdf8;
margin-bottom:25px;
}

.progress{
height:10px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin-bottom:30px;
}

.bar{
height:10px;
width:0%;
background:linear-gradient(90deg,#22c55e,#4ade80);
transition:width 0.5s;
}

.question{
font-size:22px;
margin-bottom:25px;
text-align:center;
}

.pipeline{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin-bottom:30px;
}

.step{
padding:10px 15px;
border-radius:8px;
background:#1e293b;
font-size:14px;
transition:0.3s;
}

.step.active{
background:#2563eb;
transform:scale(1.1);
}

.arrow{
font-size:20px;
color:#38bdf8;
}

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.option{
background:#1e293b;
padding:15px;
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

.option:hover{
background:#334155;
transform:scale(1.03);
}

.option.selected{
background:#2563eb;
}

.option.correct{
background:#16a34a;
}

.option.wrong{
background:#dc2626;
}

button{
margin-top:25px;
width:100%;
padding:14px;
background:#22c55e;
border:none;
border-radius:10px;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

.explanation{
margin-top:15px;
text-align:center;
color:#94a3b8;
}

.result{
text-align:center;
font-size:26px;
}

</style>
</head>

<body>

<div class="container">

<h1>RAG Concepts Quiz</h1>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="pipeline">

<div class="step" id="s0">Query</div>
<div class="arrow">→</div>
<div class="step" id="s1">Retriever</div>
<div class="arrow">→</div>
<div class="step" id="s2">Vector DB</div>
<div class="arrow">→</div>
<div class="step" id="s3">LLM</div>
<div class="arrow">→</div>
<div class="step" id="s4">Answer</div>

</div>

<div id="quiz"></div>

<button id="next">Next</button>

</div>

<script>

const data=[

{
q:"Which architecture retrieves documents before generating answers?",
options:["RAG","CNN","GAN","Decision Tree"],
a:0,
stage:1,
exp:"RAG retrieves relevant documents before the LLM generates a response."
},

{
q:"Which component finds relevant documents from a vector database?",
options:["Retriever","Tokenizer","Trainer","Optimizer"],
a:0,
stage:1,
exp:"The retriever searches the vector database to find relevant context."
},

{
q:"What converts text into vectors for semantic search?",
options:["Embedding model","Generator","Prompt template","Tokenizer"],
a:0,
stage:2,
exp:"Embedding models convert text into vectors used for similarity search."
},

{
q:"Which system stores embeddings for semantic search?",
options:["Vector database","Relational database","Spreadsheet","Cache"],
a:0,
stage:2,
exp:"Vector databases store embeddings so retrievers can search them efficiently."
},

{
q:"Which stage generates the final answer for the user?",
options:["LLM Generator","Retriever","Vector Store","Embedding model"],
a:0,
stage:3,
exp:"The LLM reads retrieved context and generates the final response."
}

]

let i=0
let score=0
let selected=null

const quiz=document.getElementById("quiz")
const next=document.getElementById("next")
const bar=document.getElementById("bar")

function highlight(stage){

document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"))

document.getElementById("s"+stage).classList.add("active")

}

function load(){

selected=null

let q=data[i]

highlight(q.stage)

let html=`<div class="question">${q.q}</div><div class="options">`

q.options.forEach((o,index)=>{
html+=`<div class="option" onclick="select(this,${index})">${o}</div>`
})

html+=`</div><div class="explanation" id="exp"></div>`

quiz.innerHTML=html

bar.style.width=(i/data.length*100)+"%"

}

function select(el,index){

document.querySelectorAll(".option").forEach(o=>o.classList.remove("selected"))

el.classList.add("selected")

selected=index

}

next.onclick=function(){

if(selected===null){
alert("Choose an option")
return
}

let q=data[i]
let opts=document.querySelectorAll(".option")

if(selected===q.a){
score++
opts[selected].classList.add("correct")
}else{
opts[selected].classList.add("wrong")
opts[q.a].classList.add("correct")
}

document.getElementById("exp").innerText=q.exp

setTimeout(()=>{

i++

if(i<data.length){
load()
}else{
show()
}

},1200)

}

function show(){

bar.style.width="100%"

quiz.innerHTML=`
<div class="result">
Score: ${score} / ${data.length}
<br><br>
<button onclick="location.reload()">Restart</button>
</div>
`

next.style.display="none"

}

load()

</script>

</body>
</html>
